<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In - NuralPath</title>
    <link rel="stylesheet" href="../output.css" />
    <script>
      (function() {
        var theme = localStorage.getItem("nuralpath_theme");
        if (theme === "dark") {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>
  </head>
  <body class="min-h-screen transition-colors duration-400">
    <!-- Subtle Background -->
    <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
      <div class="absolute -top-32 -right-32 h-[400px] w-[400px] rounded-full bg-accent/[0.05] blur-[120px] dark:bg-dark-accent/10"></div>
      <div class="absolute -bottom-48 -left-32 h-[450px] w-[450px] rounded-full bg-lilac/[0.04] blur-[140px] dark:bg-dark-secondary/08"></div>
    </div>

    <!-- Navbar -->
    <header class="fixed top-0 left-0 right-0 z-50 transition-all duration-300" id="navbar">
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <div class="glass mx-auto mt-3 rounded-2xl px-6 py-3 transition-all duration-300 md:px-8" id="nav-container">
          <nav class="flex items-center justify-between">
            <a href="../index.html" class="flex items-center gap-2.5">
              <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-accent/20 text-sm font-bold text-accent-deep shadow-sm shadow-accent/15 dark:bg-dark-accent/25 dark:text-dark-accent">N</span>
              <span class="text-lg font-bold tracking-tight text-ink-900 dark:text-dark-text">NuralPath</span>
            </a>
            <div class="flex items-center gap-3">
              <button id="theme-toggle" class="relative flex h-10 w-10 items-center justify-center rounded-xl transition-all duration-200 hover:scale-105 min-w-[44px] min-h-[44px]" aria-label="Toggle theme">
                <svg id="sun-icon" class="h-5 w-5 text-ink-500 transition-all duration-200 dark:text-dark-textMuted" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
                <svg id="moon-icon" class="hidden h-5 w-5 text-ink-500 transition-all duration-200 dark:text-dark-textMuted" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
              </button>
              <a href="signup.html" class="btn-primary px-5 py-2 text-sm">Sign Up Free</a>
            </div>
          </nav>
        </div>
      </div>
    </header>

    <!-- Login Form -->
    <main class="flex min-h-screen items-center justify-center px-4 pt-24 pb-16">
      <div class="w-full max-w-md">
        <div class="glass-strong rounded-2xl p-8 sm:p-10">
          <div class="text-center">
            <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl icon-container text-xl text-accent-deep dark:text-dark-accent">
              <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" />
              </svg>
            </div>
            <h1 class="text-2xl font-bold text-ink-900 dark:text-dark-text">Welcome Back</h1>
            <p class="mt-2 text-sm text-ink-400 dark:text-dark-textMuted">Sign in to continue your learning journey</p>
          </div>

          <form id="login-form" class="mt-8 space-y-4">
            <div>
              <label for="email" class="mb-1.5 block text-sm font-medium text-ink-700 dark:text-dark-textMuted">Email</label>
              <input type="email" id="email" name="email" class="input-skeuo w-full rounded-xl px-4 py-3 text-sm" placeholder="you@example.com" required />
            </div>
            <div>
              <label for="password" class="mb-1.5 block text-sm font-medium text-ink-700 dark:text-dark-textMuted">Password</label>
              <input type="password" id="password" name="password" class="input-skeuo w-full rounded-xl px-4 py-3 text-sm" placeholder="Enter your password" required />
            </div>
            <button type="submit" class="btn-primary w-full py-3 text-sm" id="login-btn">
              Sign In
            </button>
          </form>

          <div id="message" class="mt-4 text-center text-sm"></div>

          <p class="mt-6 text-center text-sm text-ink-400 dark:text-dark-textMuted">
            Don't have an account?
            <a href="signup.html" class="font-semibold text-accent-deep transition-colors hover:text-accent dark:text-dark-accent">Create account</a>
          </p>
        </div>

        <p class="mt-6 text-center text-xs text-ink-300 dark:text-dark-textMuted">
          By signing in, you agree to our
          <a href="terms-of-service.html" class="underline transition-colors hover:text-ink-500 dark:hover:text-dark-textMuted">Terms</a>
          and
          <a href="privacy-policy.html" class="underline transition-colors hover:text-ink-500 dark:hover:text-dark-textMuted">Privacy Policy</a>.
        </p>
      </div>
    </main>

    <script>
      // Theme toggle for this page
      (function() {
        var themeToggle = document.getElementById("theme-toggle");
        var sunIcon = document.getElementById("sun-icon");
        var moonIcon = document.getElementById("moon-icon");
        var htmlEl = document.documentElement;
        var isDark = localStorage.getItem("nuralpath_theme") === "dark";

        function applyTheme() {
          if (isDark) {
            htmlEl.classList.add("dark");
            if (sunIcon) sunIcon.classList.add("hidden");
            if (moonIcon) moonIcon.classList.remove("hidden");
          } else {
            htmlEl.classList.remove("dark");
            if (sunIcon) sunIcon.classList.remove("hidden");
            if (moonIcon) moonIcon.classList.add("hidden");
          }
        }

        if (themeToggle) {
          themeToggle.addEventListener("click", function() {
            isDark = !isDark;
            localStorage.setItem("nuralpath_theme", isDark ? "dark" : "light");
            applyTheme();
          });
        }

        applyTheme();
      })();

      // Navbar scroll
      (function() {
        var navbar = document.getElementById("navbar");
        var navContainer = document.getElementById("nav-container");
        function updateNavbar() {
          if (!navbar || !navContainer) return;
          if (window.scrollY > 50) {
            navbar.classList.add("bg-white/90", "dark:bg-dark-bg/90", "backdrop-blur-xl", "shadow-lg", "shadow-slate-200/50", "dark:shadow-black/20");
            navContainer.classList.remove("mt-3", "glass");
            navContainer.classList.add("rounded-none");
          } else {
            navbar.classList.remove("bg-white/90", "dark:bg-dark-bg/90", "backdrop-blur-xl", "shadow-lg", "shadow-slate-200/50", "dark:shadow-black/20");
            navContainer.classList.add("mt-3", "glass");
            navContainer.classList.remove("rounded-none");
          }
        }
        window.addEventListener("scroll", updateNavbar, { passive: true });
        updateNavbar();
      })();
    </script>
    <script src="../auth.js"></script>
  </body>
</html>
